# nginx configuration for serving the built single-page app.
#
# Three things matter here. Unknown paths fall through to index.html, because
# every route below / is resolved by the client-side router and a real 404 would
# break a shared link. Hashed build assets are immutable and cached for a year,
# while index.html and config.json are never cached, so replacing the ConfigMap
# that supplies config.json takes effect on the next page load rather than
# whenever a browser decides to revalidate. Finally, every writable path is
# under /tmp, which lets the container run as an unprivileged user with a
# read-only root filesystem.
#
# Author: John Grimes

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/plain;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The load balancer and the kubelet probe this rather than /, so a probe
    # never depends on the SPA shell being readable.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Vite emits content-hashed file names under /assets, so a given URL always
    # names the same bytes.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location = /config.json {
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-store";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
