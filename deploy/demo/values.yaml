# Helm values for the demo deployment at https://formlinks.fhirapp.net, on the
# pathling-demo EKS cluster.
#
# The image tag is not set here: the deploy workflow passes the commit it built,
# so the tag in the cluster names the code that is running.
#
# ## What changed when the app became a confidential SMART app
#
# This file used to carry fifteen `config` keys naming a forms server, a
# response server and a blob host. It carries four, because the app no longer
# has servers to be pointed at: the requester launches from a clinical system,
# and that one launched server is the questionnaire catalogue, the patient
# source, the response destination and the request-task store. Which servers a
# deployment may launch against is `issuers` below, and that is server-side
# configuration rather than something the browser is told.
#
# ## The demo cannot launch against the smart-launcher facade any more
#
# The previous issuer was `proxy.smartforms.io/v/r4/sim/…`, a smart-launcher-v2
# facade, used with a *public* client. This architecture needs two things that
# facade does not offer: a **confidential** launch client, whose secret lives in
# the Secret named below, and a **SMART Backend Services** client that can mint
# a short-lived access token per manifest fetch using `private_key_jwt`. Without
# the second one there is no grant to put in the link, and the direct-send
# channel degrades to the scan-back fallback on every request.
#
# So the registry names the Aidbox instance this change was validated against.
# `ops/aidboxSetup.ts` applies both client registrations, their access policies
# and the demonstration data idempotently; `docs/aidbox-validation.md` walks
# through it. Point this at a different server by replacing the entry, not by
# adding configuration to the browser.
#
# ## Before this deploys, a Secret has to exist
#
# `smart-forms-health-links-secrets` in the `formlinks` namespace, holding
# `SESSION_COOKIE_SECRET`, `LAUNCH_CLIENT_SECRET` and `BACKEND_PRIVATE_JWK`. The
# chart never templates a secret value, so the release fails to start until it
# is there. See deploy/helm/smart-forms-health-links/README.md.
#
# Author: John Grimes
smartFormsHealthLinks:
  # Links have to name the public origin, not the pod's own.
  appOrigin: "https://formlinks.fhirapp.net"

  existingSecret: "smart-forms-health-links-secrets"

  # One replica, and this is a constraint rather than a preference: the sessions
  # and the hosted invitations are one SQLite file on one ReadWriteOnce volume.
  # A second replica would not see the first one's links.

  issuers:
    - issuer: "https://kuzfdswqmz.edge.aidbox.app/fhir"
      label: "Aidbox demo"
      launchClient:
        clientId: "smart-forms-health-links"
        clientSecret: "env:LAUNCH_CLIENT_SECRET"
        # `cruds` rather than the `cu` this app once asked for. Create and update
        # alone is what write-back needs and what pre-population silently fails
        # on: a form that queries the record with no read or search scope comes
        # back with empty answers rather than an error.
        scopes: "openid fhirUser launch launch/patient online_access user/*.cruds"
      backendClient:
        clientId: "smart-forms-health-links-backend"
        privateKeyJwk: "env:BACKEND_PRIVATE_JWK"
        # The narrowest grant that closes the loop: create the response and its
        # provenance, read and complete the request task. Nothing else.
        scopes: "system/QuestionnaireResponse.c system/Provenance.c system/Task.r system/Task.u"
      # The filler's send window, which starts when they open the link rather
      # than when the clinic minted it.
      grantTtlSeconds: 3600

  # The browser-visible settings, replacing the file baked into the image. This
  # is the whole configuration and not an overlay on it: a key added to
  # public/config.json has to be added here too, or the demo falls back to
  # FALLBACK_CONFIG in src/lib/config.ts, which turns every capability off.
  #
  # linkBaseUrl is left out on purpose. The app and its links now share one
  # origin, so resolveLinkBaseUrl falling back to location.origin is already
  # right, and naming the host twice is a way for the two to disagree.
  appConfig:
    terminologyServerUrl: "https://r4.ontoserver.csiro.au/fhir"
    linkCodec: "shl"
    linkBaseUrl: null
    senderName: "Smart Forms Health Links demo"
    linkLifetimeDays: 30
    # Channel D, the no-infrastructure fallback for a filler whose send window
    # has closed or whose destination has no Backend Services.
    enableOneShotWrite: true
    enableWriteBack: true
    enablePrePopulate: true
    publishRequestTasks: true

  # The ingress is applied beside the release from deploy/demo/ingress.yaml,
  # matching the cluster's pattern, so the chart does not template one.
  ingress:
    enabled: false

  persistence:
    size: "1Gi"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
