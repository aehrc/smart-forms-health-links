# Helm values for the demo deployment at https://formlinks.fhirapp.net, on the
# pathling-demo EKS cluster.
#
# The image tag is not set here: the deploy workflow passes the commit it built,
# so the tag in the cluster names the code that is running.
#
# Author: John Grimes
smartFormsHealthLinks:
  replicas: 2

  # Replaces the config.json baked into the image, so this is the whole
  # configuration and not an overlay on it: a key added to public/config.json
  # has to be added here too, or the demo silently falls back to
  # FALLBACK_CONFIG in src/lib/config.ts, which turns features off.
  config:
    formsServerUrl: "https://smartforms.csiro.au/api/fhir"
    terminologyServerUrl: "https://r4.ontoserver.csiro.au/fhir"
    # Links have to name the public origin, not the pod's own.
    linkBaseUrl: "https://formlinks.fhirapp.net"
    linkCodec: "shl"
    responseServerUrl: "https://proxy.smartforms.io/fhir"
    blobServerUrl: "https://proxy.smartforms.io/fhir"
    blobStore: "fhir-binary"
    shlManifestUrl: null
    senderName: "Smart Forms Health Links demo"
    # Channels B and C stay off: B accepts answers without review, and C's
    # primary path is a link the filler mints and the requester reviews.
    enableServerReturn: false
    enableEncryptedReply: false
    # Channel D is on, as it is in the shipped config: a filler that cannot do
    # C's crypto still needs a way to answer. Slots go to blobServerUrl.
    enableOneShotWrite: true
    writeSlotServerUrl: null
    # Both on, as they are in the shipped config. They were absent here, which
    # is the failure this file's header warns about: the demo ran the new code
    # with both features off. Pre-population is the one that mattered for the
    # grant — buildScopes adds PRE_POPULATE_SCOPES only when
    # enablePrePopulate is true, so the launch asked for user/Condition.cu and
    # never user/Condition.crus, and a form querying the record would have
    # come back empty rather than refused.
    enableWriteBack: true
    enablePrePopulate: true
    linkLifetimeDays: 30
    publishRequestTasks: true
    # A launch is optional: with none the app stays anonymous, which the filler
    # half depends on.
    #
    # The issuer is the smart-launcher-v2 facade over the same data as
    # responseServerUrl, and the only base there that serves
    # .well-known/smart-configuration. The /sim/ segment is required: it is
    # base64url of the launcher's launch-options array, here
    # [2, "example-hypertension", "cardy-igist", "AUTO", 1, 1, 0, "", "", "",
    #  "", "", "", "", 0, 1, ""] — a provider-standalone launch with the
    # practitioner and patient pinned and both interactive screens skipped.
    #
    # Pinned and skipped because this launcher deployment serves no UI at all:
    # every screen it redirects to answers "this route does not exist". A launch
    # that needs no screen completes in the backend, so signing in yields a real
    # token and a real fhirUser (Practitioner/cardy-igist) for attribution, at
    # the cost of one fixed demo identity. See docs/smart-app-launch.md.
    enableSmartLaunch: true
    smartIssuerUrl: "https://proxy.smartforms.io/v/r4/sim/WzIsImV4YW1wbGUtaHlwZXJ0ZW5zaW9uIiwiY2FyZHktaWdpc3QiLCJBVVRPIiwxLDEsMCwiIiwiIiwiIiwiIiwiIiwiIiwiIiwwLDEsIiJd/fhir"
    smartClientId: "smart-forms-health-links"
    smartScopes: null
