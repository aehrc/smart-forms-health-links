# Continuously deploys main to https://formlinks.fhirapp.net, on the
# pathling-demo EKS cluster.
#
# The image is tagged with the commit it was built from, so the tag in the
# cluster names the code that is running and every deployment pulls a distinct
# reference. Both architectures are built because the cluster's node pool takes
# amd64 and arm64 capacity, and a single-architecture image works only until the
# node it landed on is replaced by one of the other kind. The image now carries a
# Node process rather than nginx, and `npm ci` compiles better-sqlite3 from
# source when no prebuilt binary matches, so the non-native architecture builds
# under emulation and this step is slower than it was.
#
# ## Two prerequisites this workflow does not create
#
# The release will not start without a Secret named
# `smart-forms-health-links-secrets` in the `formlinks` namespace, holding
# SESSION_COOKIE_SECRET, LAUNCH_CLIENT_SECRET and BACKEND_PRIVATE_JWK. The chart
# refuses to render without the name and the pod refuses to boot without the
# values, which is deliberate: nothing here should be able to template a
# credential.
#
# The launched server named in deploy/demo/values.yaml must also have both
# clients registered, which `npm run setup:aidbox` does idempotently. See
# docs/aidbox-validation.md.
#
# ## Why the rollout looks different
#
# One replica, and `Recreate` rather than a rolling update: the sessions and the
# hosted invitations are one SQLite file on one ReadWriteOnce volume, so two pods
# would either fail to schedule or contend for the file. Expect a few seconds of
# downtime per deployment, and expect existing sessions to survive it - they are
# in the file, not in memory.
#
# This runs on the self-hosted runner rather than a GitHub-hosted one, so it
# costs no Actions minutes. The runner is an amd64 Linux host with Docker,
# kubectl and Helm installed system wide; anything else the job needs it
# installs for itself.
#
# Author: John Grimes
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Deployments are serialised rather than cancelled: a half-finished rollout
  # that gets cancelled leaves the release in whatever state Helm reached.
  group: deploy-demo
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  CLUSTER: pathling-demo
  NAMESPACE: formlinks
  RELEASE: smart-forms-health-links
  REGISTRY: 865780493209.dkr.ecr.ap-southeast-2.amazonaws.com

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      # Required to exchange the GitHub OIDC token for AWS credentials.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The runner user cannot write to a system directory, so the CLI goes
      # under its home, where the next run finds it again. It gets a directory
      # of its own rather than the user's own bin directory, so that only the
      # CLI is added to the job's path. The installer is unpacked into the
      # runner's temporary directory because /tmp on this host is noexec.
      - name: Install the AWS CLI
        run: |
          echo "$HOME/.local/aws-cli/bin" >> "$GITHUB_PATH"
          if [ -x "$HOME/.local/aws-cli/bin/aws" ]; then
            exit 0
          fi
          curl --silent --show-error --fail --location \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
            --output "$RUNNER_TEMP/awscliv2.zip"
          unzip -q -o "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/aws/install" --install-dir "$HOME/.local/aws-cli" \
            --bin-dir "$HOME/.local/aws-cli/bin"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::865780493209:role/SmartFormsHealthLinksDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The build summary is off because uploading it needs artifact storage,
      # which this account has run out of, so it only ever fails.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.RELEASE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # The runner's user has a kubeconfig of its own, which the job must not
      # take over, so the cluster's credentials go in a file for this run alone
      # and the steps after this one are pointed at it.
      - name: Update kubeconfig
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      # `upgrade --install` so a release that has been uninstalled comes back
      # rather than failing here.
      - name: Upgrade the release
        run: |
          helm upgrade --install "$RELEASE" deploy/helm/smart-forms-health-links \
            --namespace "$NAMESPACE" \
            --values deploy/demo/values.yaml \
            --set "smartFormsHealthLinks.image=$REGISTRY/$RELEASE:$GITHUB_SHA" \
            --timeout 5m

      # Applied every run so a change to the manifest ships with the commit that
      # makes it. The ALB it describes already exists, so this is normally a
      # no-op.
      - name: Apply the ingress
        run: kubectl apply --filename deploy/demo/ingress.yaml

      - name: Wait for the rollout
        run: |
          kubectl rollout status "deployment/$RELEASE-deployment" \
            --namespace "$NAMESPACE" --timeout=5m
