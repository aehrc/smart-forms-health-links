# Continuously deploys main to https://formlinks.fhirapp.net, on the
# pathling-demo EKS cluster.
#
# The image is tagged with the commit it was built from, so the tag in the
# cluster names the code that is running and every deployment pulls a distinct
# reference. Both architectures are built because the cluster's node pool takes
# amd64 and arm64 capacity, and a single-architecture image works only until the
# node it landed on is replaced by one of the other kind.
#
# Author: John Grimes
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Deployments are serialised rather than cancelled: a half-finished rollout
  # that gets cancelled leaves the release in whatever state Helm reached.
  group: deploy-demo
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  CLUSTER: pathling-demo
  NAMESPACE: formlinks
  RELEASE: smart-forms-health-links
  REGISTRY: 865780493209.dkr.ecr.ap-southeast-2.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Required to exchange the GitHub OIDC token for AWS credentials.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::865780493209:role/SmartFormsHealthLinksDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.RELEASE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      # `upgrade --install` so a release that has been uninstalled comes back
      # rather than failing here.
      - name: Upgrade the release
        run: |
          helm upgrade --install "$RELEASE" deploy/helm/smart-forms-health-links \
            --namespace "$NAMESPACE" \
            --values deploy/demo/values.yaml \
            --set "smartFormsHealthLinks.image=$REGISTRY/$RELEASE:$GITHUB_SHA" \
            --timeout 5m

      # Applied every run so a change to the manifest ships with the commit that
      # makes it. The ALB it describes already exists, so this is normally a
      # no-op.
      - name: Apply the ingress
        run: kubectl apply --filename deploy/demo/ingress.yaml

      - name: Wait for the rollout
        run: |
          kubectl rollout status "deployment/$RELEASE-deployment" \
            --namespace "$NAMESPACE" --timeout=5m
